[project]
name = "astro"
version = "0.1.0"
description = "Sky reconstruction and subtraction for the Haro 11 MUSE mosaic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.0",
    "jdaviz>=5.0.2",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pyyaml>=6.0",
    "sep>=1.4.0",
    "setuptools<81",
    "specutils>=2.4.0",
    "zap",
]

[project.scripts]
skymodel = "skymodel.run_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["skymodel*"]
