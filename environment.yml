# The pipeline. Create the environment with:
#
#   conda env create -f environment.yml
#   conda activate astro
#
# The ZAP comparison arm under src/zap needs the libs/zap submodule and is not
# part of this; environment-zap.yml adds it.
name: astro
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -e .
